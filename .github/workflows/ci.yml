name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e '.[dev]'
      - name: Clone bundled example source LZs
        run: |
          git clone --depth 1 https://github.com/aws-samples/sample-malaysia-secure-lz.git ../sample-malaysia-secure-lz
          git clone --depth 1 https://github.com/aws-samples/sample-thailand-secure-lz.git ../sample-thailand-secure-lz
      - name: Smoke test — malaysia example
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cfn2lza convert \
            --profile examples/malaysia/profile.py \
            --source-dir ../sample-malaysia-secure-lz/cloudformation \
            --out-dir ./ci-out/malaysia \
            --reports-dir ./ci-reports/malaysia \
            --unmapped-dir ./ci-unmapped/malaysia
      - name: Smoke test — thailand example
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cfn2lza convert \
            --profile examples/thailand/profile.py \
            --source-dir ../sample-thailand-secure-lz/cloudformation \
            --out-dir ./ci-out/thailand \
            --reports-dir ./ci-reports/thailand \
            --unmapped-dir ./ci-unmapped/thailand
      - name: Pytest
        run: pytest -v
